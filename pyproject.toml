[tool.ruff]
target-version = "py311"
line-length = 100

exclude = [
    ".git",
    ".pytest_cache",
    "venv",
    ".venv",
    "scratch",
    "frontend",
    "data",
    "models",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (idiomatic in FastAPI Depends/Query)
    "B904",  # raise ... from err (noisy in service exception handlers)
    "B905",  # zip without strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
"docker-entrypoint-*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
