name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint-and-test:
    name: Backend & Engine (Ruff + Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: matchops
          POSTGRES_PASSWORD: matchops
          POSTGRES_DB: matchops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Create virtual environment and install dependencies
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r backend/requirements.txt \
            -r engine/requirements.txt \
            pytest pytest-cov ruff

      - name: Run Ruff linter
        run: .venv/bin/ruff check backend/ engine/ tests/ conftest.py scripts/

      - name: Run Ruff format check
        run: .venv/bin/ruff format --check backend/ engine/ tests/ conftest.py scripts/

      - name: Verify database initialization
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://matchops:matchops@localhost:5432/matchops_test
          MATCHOPS_API_KEY: ci-test-api-key
        run: |
          .venv/bin/python -c "from backend.repositories.database_init_repository import initialize_database_schema; initialize_database_schema()"

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
          MATCHOPS_API_KEY: ci-test-api-key
          TEST_DATABASE_URL: postgresql+psycopg://matchops:matchops@localhost:5432/matchops_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: .venv/bin/pytest -rs -v -m "not live_models" --cov=backend --cov=engine --cov-report=term --cov-report=xml --cov-fail-under=55

  frontend-lint-and-test:
    name: Frontend (ESLint + Prettier + Vitest + E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier check
        run: pnpm run format:check

      - name: Run Vitest Unit Tests
        run: pnpm run test:run

      - name: Build Production Bundle
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Tests
        run: pnpm run test:e2e

  docker-compose-check:
    name: Docker Compose Config Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
