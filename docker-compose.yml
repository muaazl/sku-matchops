services:
  # Internal-only services (postgres, qdrant, engine) are NOT published to the
  # host. They communicate over the private compose network by service name.
  # For local debugging, docker-compose.override.yml re-publishes their ports.
  postgres:
    image: postgres:16-alpine
    container_name: sku_matchops_postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-matchops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-matchops}
      - POSTGRES_DB=${POSTGRES_DB:-matchops}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchops} -d ${POSTGRES_DB:-matchops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Postgres web UI at http://localhost:5050 (start with `docker compose --profile debug up -d pgadmin`).
  # Bound to 127.0.0.1 only because desktop mode has no authentication.
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: sku_matchops_pgadmin
    profiles:
      - debug
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-matchops}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sku_matchops_redis
    expose:
      - "6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sku_matchops_qdrant
    expose:
      - "6333"
    volumes:
      - ./data/qdrant:/qdrant/storage:z
    restart: unless-stopped

  # Dedicated ML Engine Microservice
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: sku_matchops_engine
    mem_limit: 4800m
    expose:
      - "8001"
      - "50051"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - BACKEND_URL=http://backend:8000
      - ENGINE_PORT=8001
      - ENGINE_GRPC_PORT=50051
      - USE_INT8_MODELS=true
      - TZ=Asia/Colombo
      - REDIS_URL=redis://redis:6379/0
      - UVICORN_RELOAD=false
    env_file:
      - .env
    volumes:
      - ./engine:/app/engine
      - ./data:/app/data
      - cache_data:/app/data/cache
      - models_data:/app/models
      - ./models:/host_models:ro
      - ./data/cache:/host_cache:ro
      - ./scripts:/app/scripts
      - ./docker-entrypoint-engine.py:/app/docker-entrypoint-engine.py
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sku_matchops_backend
    mem_limit: 512m
    ports:
      - "8000:8000"
    environment:
      - ENGINE_URL=http://engine:8001
      - ENGINE_GRPC_URL=engine:50051
      - BACKEND_INTERNAL_URL=http://backend:8000
      - TZ=Asia/Colombo
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-matchops}:${POSTGRES_PASSWORD:-matchops}@postgres:5432/${POSTGRES_DB:-matchops}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - UVICORN_RELOAD=false
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./engine:/app/engine
      - ./data:/app/data
      - cache_data:/app/data/cache
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
      - ./docker-entrypoint-backend.py:/app/docker-entrypoint-backend.py
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sku_matchops_frontend
    mem_limit: 512m
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  models_data:
  cache_data:
