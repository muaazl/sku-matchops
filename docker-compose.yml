services:
  # Internal-only services (postgres, qdrant, engine) are NOT published to the
  # host. They communicate over the private compose network by service name.
  # For local debugging, docker-compose.override.yml re-publishes their ports.
  postgres:
    image: postgres:16-alpine
    container_name: sku_matchops_postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-matchops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-matchops}
      - POSTGRES_DB=${POSTGRES_DB:-matchops}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchops} -d ${POSTGRES_DB:-matchops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Postgres web UI at http://localhost:5050 (no login; the matchops server is pre-registered).
  # Bound to 127.0.0.1 only because desktop mode has no authentication.
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: sku_matchops_pgadmin
    ports:
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-matchops}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    restart: unless-stopped

  # One-shot: applies Alembic migrations before the Gateway starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sku_matchops_migrate
    entrypoint: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-matchops}:${POSTGRES_PASSWORD:-matchops}@postgres:5432/${POSTGRES_DB:-matchops}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: sku_matchops_redis
    expose:
      - "6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sku_matchops_qdrant
    expose:
      - "6333"
    volumes:
      - ./data/qdrant:/qdrant/storage:z
    restart: unless-stopped

  # Horizontally scalable: every replica consumes the shared Redis job queue and serves gRPC inference.
  #   docker compose up -d --scale engine=3
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    expose:
      - "8001"
      - "50051"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - BACKEND_URL=http://backend:8000
      - ENGINE_PORT=8001
      - ENGINE_GRPC_PORT=50051
      - USE_INT8_MODELS=true
      - TZ=Asia/Colombo
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./engine:/app/engine
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./scripts:/app/scripts
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sku_matchops_backend
    ports:
      - "8000:8000"
    environment:
      - ENGINE_URL=http://engine:8001
      - ENGINE_GRPC_URL=engine:50051
      - BACKEND_INTERNAL_URL=http://backend:8000
      - TZ=Asia/Colombo
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-matchops}:${POSTGRES_PASSWORD:-matchops}@postgres:5432/${POSTGRES_DB:-matchops}
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./engine:/app/engine
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./migrations:/app/migrations
    depends_on:
      engine:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sku_matchops_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    restart: unless-stopped
