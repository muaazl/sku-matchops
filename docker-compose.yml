services:
  # Internal-only services (qdrant, meilisearch, engine) are NOT published to the
  # host. They communicate over the private compose network by service name.
  # For local debugging, docker-compose.override.yml re-publishes their ports.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sku_matchops_qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - ./data/qdrant:/qdrant/storage:z
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11.0
    container_name: sku_matchops_meilisearch
    expose:
      - "7700"
    environment:
      - MEILI_HOST=0.0.0.0:7700
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-meilimasterkey}
    volumes:
      - ./data/meilisearch:/meili_data
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: sku_matchops_engine
    expose:
      - "8001"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-meilimasterkey}
      - BACKEND_URL=http://backend:8000
      - ENGINE_PORT=8001
      - USE_INT8_MODELS=true
      - TZ=Asia/Colombo
    env_file:
      - .env
    volumes:
      - ./engine:/app/engine
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./scripts:/app/scripts
    depends_on:
      - qdrant
      - meilisearch
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sku_matchops_backend
    ports:
      - "8000:8000"
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-meilimasterkey}
      - ENGINE_URL=http://engine:8001
      - BACKEND_INTERNAL_URL=http://backend:8000
      - TZ=Asia/Colombo
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./engine:/app/engine
      - ./data:/app/data
      - ./scripts:/app/scripts
    depends_on:
      - meilisearch
      - engine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sku_matchops_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    restart: unless-stopped

