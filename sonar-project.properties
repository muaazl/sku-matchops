# ==============================================================================
# SonarQube Configuration — SKU MatchOps
# ==============================================================================
sonar.projectKey=sku-matchops
sonar.projectName=SKU MatchOps
sonar.sourceEncoding=UTF-8

# Source & test directories
sonar.sources=backend,engine,frontend/src
sonar.tests=tests,frontend/src

# Keep test files out of sonar.sources so nothing is indexed twice
sonar.test.inclusions=tests/**/*.py,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/*.spec.js,frontend/src/**/*.spec.jsx
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/__pycache__/**,**/.pytest_cache/**,**/node_modules/**,engine/protos/**,backend/protos/**,frontend/dist/**,frontend/coverage/**,.venv/**,data/**
sonar.test.exclusions=**/__pycache__/**,**/.pytest_cache/**

# Language & coverage settings
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
